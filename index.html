<body><div id="app"><div class="login-screen"><p>Opening your home…</p></div></div>
<dialog id="editor" aria-labelledby="dialog-title"><form id="editor-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="icon-btn" data-close aria-label="Close dialog">×</button></div><div id="dialog-fields" class="dialog-body"></div><div id="dialog-error" class="dialog-error" role="alert"></div><div class="dialog-footer"><button type="button" id="dialog-delete" class="btn danger" hidden>Delete</button><span class="spacer"></span><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Save</button></div></form></dialog>
<div id="toast" class="toast" role="status" hidden></div><input id="import-file" type="file" accept="application/json,.json" hidden>
<script>
(function () {
  var root = document.getElementById('app');
  function pending() { return root && root.textContent.trim() === 'Opening your home…'; }
  function fail() {
    if (!pending()) return;
    root.innerHTML = '<div class="login-screen"><section class="panel login-card"><h1>Home is taking a moment.</h1><p class="helper">The dashboard could not finish opening. Check your connection to the home server, then try again. On an older TV, use a current browser or a browser player.</p><button type="button" class="btn" id="startup-retry">Try again</button></section></div>';
    document.getElementById('startup-retry').addEventListener('click', function () { location.reload(); });
  }
  window.addEventListener('error', fail);
  window.addEventListener('unhandledrejection', fail);

function validateImport(value){
 const data=value&&value.state||value;
 if(!data||data.schema!==1)throw new Error('This is not a supported Homeboard backup.');
 const clean=initial(),repeats=['none','daily','weekly','monthly','yearly'];
 const text=(v,label,max=200,required=false)=>{if(typeof v!=='string'||v.length>max||v.includes('\0')||(required&&!v.trim()))throw new Error('Invalid '+label+'.');return v;};
 const date=(v,label,optional=false)=>{if(optional&&(v===''||v==null))return '';text(v,label,10,true);try{D.addDays(v,0);}catch(_){throw new Error('Invalid '+label+'.');}if(v<'1900-01-01'||v>'2200-12-31')throw new Error(label+' must be between 1900 and 2200.');return v;};
 const flag=(v,label)=>{if(v==null)return false;if(typeof v!=='boolean')throw new Error('Invalid '+label+'.');return v;};
 const repeat=v=>{if(!repeats.includes(v))throw new Error('Invalid recurrence.');return v;};
 const stamp=v=>{if(v==null||v==='')return '';text(v,'completion date',60);if(!Number.isFinite(Date.parse(v)))throw new Error('Invalid completion date.');return v;};
 const collection=(name,limit)=>{const rows=data[name];if(!Array.isArray(rows)||rows.length>limit)throw new Error('Invalid '+name+' collection.');const ids=new Set();for(const x of rows){if(!x||typeof x.id!=='string'||!/^[A-Za-z0-9_.:@-]{1,100}$/.test(x.id)||ids.has(x.id))throw new Error('Invalid or duplicate record identifier.');ids.add(x.id);}return rows;};
 clean.members=collection('members',30).map(x=>{if(!['sage','blue','rose','amber'].includes(x.color))throw new Error('Invalid member color.');return {id:x.id,name:text(x.name,'member name',60,true),color:x.color};});
 if(!clean.members.length||!clean.members.some(x=>x.id==='family'))throw new Error('The Family profile is required.');
 const memberId=v=>{if(!clean.members.some(x=>x.id===v))throw new Error('An assigned family member is missing.');return v;};
 clean.events=collection('events',5000).map(x=>{const issues=D.validateEvent(x);if(issues.length)throw new Error('Invalid event: '+issues.join(' '));const e={id:x.id,title:text(x.title,'event title',200,true),date:date(x.date,'event date'),time:text(x.time||'','event time',5),endTime:text(x.endTime||'','end time',5),allDay:flag(x.allDay,'all-day flag'),memberId:memberId(x.memberId),repeat:repeat(x.repeat),weekdays:x.weekdays?x.weekdays.slice():[],until:date(x.until,'repeat-until date',true),exceptions:(x.exceptions||[]).map(v=>date(v,'exception date')),description:text(x.description||'','event notes',4000),location:text(x.location||'','event location',300),reminder:x.reminder||0,private:flag(x.private,'privacy flag')};if(![0,15,30,60,1440].includes(e.reminder))throw new Error('Invalid reminder.');if(!e.allDay&&e.time&&e.endTime&&e.endTime<=e.time)throw new Error('Event end time must follow start time.');if(x.seriesId)e.seriesId=text(x.seriesId,'series identifier',100);return e;});
 clean.tasks=collection('tasks',5000).map(x=>{const t={id:x.id,title:text(x.title,'task title',200,true),due:date(x.due,'task due date',true),memberId:memberId(x.memberId),repeat:repeat(x.repeat),done:flag(x.done,'completion flag'),completedAt:stamp(x.completedAt)};if(t.repeat!=='none'&&!t.due)throw new Error('A recurring task needs a due date.');if(x.seriesId)t.seriesId=text(x.seriesId,'task series',100);return t;});
 clean.items=collection('items',5000).map(x=>({id:x.id,title:text(x.title,'shopping item',200,true),quantity:text(x.quantity||'','quantity',80),category:text(x.category||'Other','category',80),list:text(x.list||'Groceries','list',80,true),done:flag(x.done,'item completion'),completedAt:stamp(x.completedAt)}));
 clean.notes=collection('notes',300).map(x=>({id:x.id,text:text(x.text,'note',2000,true),expires:date(x.expires,'note expiry',true),private:flag(x.private,'note privacy')}));
 const prefs=data.preferences||{};clean.preferences={household:text(prefs.household||'Our home','household name',100,true),timezone:text(prefs.timezone||'Asia/Yekaterinburg','timezone',100,true),hour24:prefs.hour24==null?true:flag(prefs.hour24,'clock format'),theme:prefs.theme||'warm'};if(!['warm','premium','smart'].includes(clean.preferences.theme))throw new Error('Invalid theme.');new Intl.DateTimeFormat('en',{timeZone:clean.preferences.timezone});
 if(!data.meals||typeof data.meals!=='object'||Array.isArray(data.meals)||Object.keys(data.meals).length>1500)throw new Error('Invalid meal plan.');clean.meals={};for(const [key,v] of Object.entries(data.meals))clean.meals[date(key,'meal date')]=text(v,'meal',300);
 return clean;
}

const APP_VERSION='0.3.0-rc.1';

function renderOnboarding(){

function captureOnboarding(form,validate=true){
 const f=new FormData(form);
 if(wizard.step===1){wizard.home=String(f.get('household')||'').trim();wizard.timezone=String(f.get('timezone')||'').trim();wizard.hour24=f.get('hour24')==='24';if(validate){if(!wizard.home)throw new Error('Give your home a name.');try{new Intl.DateTimeFormat('en',{timeZone:wizard.timezone}).format(new Date());}catch(_){throw new Error('Choose a valid time zone, such as Europe/London.');}}}
 if(wizard.step===2){wizard.ownerName=String(f.get('ownerName')||'').trim();wizard.username=String(f.get('username')||'').trim().toLowerCase();wizard.password=String(f.get('password')||'');wizard.confirm=String(f.get('confirm')||'');if(!wizard.localClaim)wizard.setupKey=String(f.get('setupKey')||'').trim();if(validate){if(!wizard.ownerName)throw new Error('Enter your name.');if(!/^[a-z0-9_.-]{3,40}$/.test(wizard.username))throw new Error('Use 3–40 letters, numbers, periods, underscores or hyphens for your username.');if(wizard.password.length<12)throw new Error('Choose a password with at least 12 characters.');if(wizard.password!==wizard.confirm)throw new Error('The passwords don’t match yet.');if(!wizard.preview&&!wizard.setupKey)throw new Error('Open Homeboard on the hosting computer, or enter its device setup code.');}}
 if(wizard.step===3)wizard.people=wizard.people.map((person,i)=>({name:String(f.get('person-name-'+i)||'').trim(),color:String(f.get('person-color-'+i)||person.color)}));
 if(wizard.step===4)wizard.theme=String(f.get('theme')||wizard.theme);
}
async function advanceOnboarding(form){
 if(!wizard||wizard.busy)return;
 try{captureOnboarding(form);wizard.error='';if(wizard.step<4){wizard.step++;renderOnboarding();return;}
  if(wizard.preview){wizard.password='';wizard.confirm='';wizard=null;history.replaceState(null,'',location.pathname);await boot();return;}
  wizard.busy=true;renderOnboarding();
  const result=await api('/api/setup',{method:'POST',body:JSON.stringify({setupKey:wizard.setupKey,name:wizard.ownerName,username:wizard.username,password:wizard.password,household:{name:wizard.home,timezone:wizard.timezone,hour24:wizard.hour24,theme:wizard.theme},members:wizard.people.filter(p=>p.name).map(p=>({name:p.name,color:p.color}))})});
  const username=wizard.username;wizard.password='';wizard.confirm='';wizard.setupKey='';wizard=null;
  me=result.user;csrf=result.csrf;connection='Connected to home';
  showRecoveryKit(result.recoveryCode,username,async()=>{securityKit=null;await boot();},true,result.backupCreated!==false);
  try{const fresh=await api('/api/state');state=fresh.state;revision=fresh.revision;}catch(_){/* Keep the recovery kit visible if the connection drops after setup. */}
  await loadProductStatus();if(securityKit)renderRecoveryKit();
 }catch(e){if(wizard){wizard.busy=false;wizard.error=e.message;renderOnboarding();}else{error=e.message;await boot();}}
}
function showRecoveryKit(code,username,next,firstRun=false,backupCreated=true){if(stream){stream.close();stream=null;}securityKit={code,username,next,firstRun,backupCreated,saved:false};renderRecoveryKit();}
function deviceLinks(){
 const urls=systemStatus&&Array.isArray(systemStatus.networkUrls)?systemStatus.networkUrls:[];
 const list=urls.length?urls:(!['localhost','127.0.0.1','[::1]','::1'].includes(location.hostname)?[location.origin]:[]);
 return list;
}
function renderRecoveryKit(){
 if(!securityKit)return;document.body.classList.remove('display-mode');const kit=securityKit,links=deviceLinks();
 app.innerHTML=productFrame('<section class="setup-card kit-card"><div class="setup-body"><div class="success-mark">'+icon('check')+'</div><div class="onboard-heading"><span class="onboard-eyebrow">'+(kit.firstRun?'Welcome home':'Keep your keys safe')+'</span><h1>'+(kit.firstRun?'Your home is ready.':'Your recovery kit.')+'</h1><p>Save this recovery code somewhere private. It lets you reset your owner password if you forget it.</p></div><div class="recovery-panel"><span>Owner username</span><strong>'+esc(kit.username)+'</strong><span>Recovery code</span><code>'+esc(kit.code||'')+'</code><p>Anyone with this code can reset this account. A used code is replaced with a new one.</p></div><button type="button" class="btn primary" data-product="download-kit">'+icon('download')+' Save recovery kit</button><label class="form-check kit-confirm"><input id="kit-saved" type="checkbox" '+(kit.saved?'checked':'')+'>I’ve saved my recovery code somewhere safe</label>'+(kit.firstRun&&!kit.backupCreated?'<p class="setup-error" role="status">Your home was created, but its first automatic backup could not be saved. Open Settings → Back up now to retry.</p>':'')+(kit.firstRun?'<div class="connect-summary"><h3>Bring the rest of your home along.</h3><p>On a phone connected to the same Wi-Fi, open:</p>'+(links.length?links.map(url=>'<code class="share-address">'+esc(url)+'</code>').join(''):'<p>Connect this computer to your home Wi-Fi, then find the phone address in Help → Connect your devices.</p>')+'<p>Add adult and TV accounts in Settings. The TV uses a display-only account.</p></div>':'')+'</div><div class="setup-actions"><span class="subtle">Your recovery code is shown only now.</span><button type="button" class="btn primary" data-product="kit-continue" '+(!kit.saved?'disabled':'')+'>'+(kit.firstRun?'Open Homeboard':'Continue')+'</button></div></section>');
}
function downloadRecoveryKit(){
 if(!securityKit)return;const kit=securityKit;
 const text='HOMEBOARD RECOVERY KIT\n\nUsername: '+kit.username+'\nRecovery code: '+kit.code+'\n\nKeep this file somewhere private. Anyone with the recovery code can reset this owner account.\n\nTo recover access: open Homeboard, choose Recover access, enter your username and this code, then choose a new password. A new recovery code replaces this one after use.\n\nThis kit does not contain your family data. Keep household backups separately.\n';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download='Homeboard-Recovery-Kit.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Keep the recovery kit somewhere private.');
}
function recoveryScreen(){
 document.body.classList.remove('display-mode');app.innerHTML=productFrame('<section class="panel login-card"><h1>Find your way home.</h1><p class="subtle">Use your saved recovery kit to reset the owner password.</p><form id="recover-form">'+field('Username','username','','text','required autocomplete="username" maxlength="40"')+field('Recovery code','recoveryCode','','password','required autocomplete="off" maxlength="300"')+field('New password','password','','password','required minlength="12" maxlength="200" autocomplete="new-password"')+field('Confirm new password','confirm','','password','required minlength="12" maxlength="200" autocomplete="new-password"')+'<p class="helper">This signs the owner account out on its other devices. Other family accounts keep their access.</p><p id="recover-error" class="setup-error" role="alert"></p><button class="btn primary">Reset my password</button></form><button type="button" class="btn ghost" data-product="back-login">Back to sign in</button></section>');
}
async function loadProductStatus(){
 if(LOCAL)return;
 try{systemStatus=me&&me.role==='admin'?await api('/api/system'):await api('/api/product');}catch(_){systemStatus=null;}
}
function productSettingsCard(){
 if(LOCAL)return '<section class="panel"><h3>Homeboard '+APP_VERSION+'</h3><p class="helper">Standalone preview. Install the Windows app to share one home across your devices.</p></section>';
 if(!me||me.role!=='admin')return '';
 return '<section class="panel"><div class="panel-heading"><h2>Your Homeboard</h2><span class="pill">Self-hosted</span></div><p class="helper">Version '+APP_VERSION+' · Release candidate</p><div class="tools">'+act('help-home',icon('help')+' Help & getting started')+act('backup-now',icon('download')+' Back up now')+act('recovery-kit','Recovery kit')+'</div><p class="helper">'+(systemStatus&&systemStatus.backup&&systemStatus.backup.lastCreatedAt?'Latest automatic backup: '+esc(new Date(systemStatus.backup.lastCreatedAt).toLocaleString()):'Backups are stored on this computer. Copy them to another drive for protection against disk failure.')+'</p><button type="button" class="btn ghost" data-action="setup-preview">Preview first-time setup</button></section>';
}
function renderHelp(){
 const links=deviceLinks(),primary=links[0];
 return '<div class="help-hero"><span class="pill">Homeboard '+APP_VERSION+'</span><h2>A calmer home starts here.</h2><p>Small steps for getting everyone connected and keeping your home safe.</p></div><div class="help-grid"><section class="panel"><div class="help-icon">'+icon('house')+'</div><h2>Your first few minutes</h2><ol><li>Add your family’s names and colors in Settings.</li><li>Add a plan to the calendar. Choose Every week for specific weekdays.</li><li>Add a few groceries and one task for today.</li><li>Give each adult a separate sign-in in Settings → Household access.</li></ol><p class="helper">Family profiles label plans. Sign-in accounts control who can edit.</p></section><section class="panel"><div class="help-icon">'+icon('screen')+'</div><h2>Connect your devices</h2><p class="helper">Keep this computer running and use the same home Wi-Fi on your phone or TV.</p>'+(links.length?links.map(url=>'<code class="share-address">'+esc(url)+'</code>').join(''):'<p class="helper">Your home-network address is not available yet. Connect the computer to Wi-Fi, reopen Homeboard, and check again.</p>')+'<ol><li>On Android or iPhone, open the address above in your browser and sign in.</li><li>For a kitchen screen, create a Display account in Settings.</li><li>Open '+esc(primary?primary+'/display':'the same address followed by /display')+' on the TV and use that Display account.</li></ol><p class="helper">If Windows asks about network access, allow the app on your private home network. A guest Wi-Fi network may block devices from reaching each other.</p></section><section class="panel"><div class="help-icon">'+icon('calendar')+'</div><h2>Plans that stay simple</h2><p class="helper">Use the visible Edit button beside a plan, task or shopping item. When editing a repeating event, choose one occurrence or the entire series.</p><p class="helper">For weekly events, tick the days you want. The starting date is the earliest date it can appear. Completed shopping stays visible for seven days.</p></section><section class="panel"><div class="help-icon">'+icon('download')+'</div><h2>Backups & recovery</h2><p class="helper">Daily backups stay in your Homeboard data folder. Copy them to another drive. An exported JSON backup contains household information; a database backup also includes accounts.</p><p class="helper">Lost your owner password? Choose Recover access on the sign-in screen and use your saved recovery kit. Generate a replacement kit in Settings if you can still sign in.</p><p class="helper">Updating or uninstalling the Windows app keeps your household data. Always make a backup before updating.</p></section><section class="panel"><h2>If something feels stuck</h2><ul><li>Open Homeboard from your applications menu or folder.</li><li>Check that the hosting computer is awake and connected to Wi-Fi.</li><li>Refresh the browser after installing an update.</li><li>If a TV browser is too old, connect a small browser player by HDMI.</li></ul></section><section class="panel"><h2>What stays local</h2><p class="helper">Calendars, lists and tasks work over your home network even when the internet is down. Offline editing and closed-app reminders are not included in this edition.</p><p class="helper">This build is a release candidate. Phone/TV access uses your local network; remote access and trusted HTTPS need separate configuration for your network. Never forward its app port directly to the internet.</p></section></div>';
}
async function openHelp(){view='help';render();await loadProductStatus();if(view==='help')render();}
document.addEventListener('click',async event=>{
 const step=event.target.closest('[data-onboard]');
 if(step&&wizard){try{const form=document.getElementById('onboarding-form');captureOnboarding(form,false);const action=step.dataset.onboard;if(action==='back')wizard.step=Math.max(0,wizard.step-1);else if(action==='add-person'){if(wizard.people.length>=12)throw new Error('You can add up to 12 people during setup.');wizard.people.push({name:'',color:['rose','blue','sage','amber'][wizard.people.length%4]});}else if(action==='remove-person')wizard.people.splice(Number(step.dataset.index),1);wizard.error='';renderOnboarding();}catch(e){wizard.error=e.message;renderOnboarding();}return;}
 const action=event.target.closest('[data-product]');if(action){const type=action.dataset.product;if(type==='download-kit')downloadRecoveryKit();else if(type==='kit-continue'&&securityKit&&securityKit.saved){const next=securityKit.next;securityKit=null;await next();}else if(type==='back-login')loginScreen(true);else if(type==='recover')recoveryScreen();return;}
 const button=event.target.closest('[data-action]');if(!button)return;
 try{if(button.dataset.action==='help-home')await openHelp();else if(button.dataset.action==='setup-preview'){wizard=null;await startOnboarding(true);}else if(button.dataset.action==='backup-now'){button.disabled=true;await api('/api/backups',{method:'POST',body:'{}'});await loadProductStatus();toast('A fresh backup is saved on this computer.');render();}else if(button.dataset.action==='recovery-kit')openEditor('Replace your recovery kit',field('Confirm your owner password','password','','password','required autocomplete="current-password"')+'<p class="helper">Your old recovery code will stop working. Save the new kit somewhere private.</p>',async f=>{const result=await api('/api/recovery-code',{method:'POST',body:JSON.stringify({password:f.get('password')})});dialog.close();showRecoveryKit(result.recoveryCode,result.username||(users.find(user=>user.id===me.id)||{}).username||'Your owner username',()=>{securityKit=null;render();});});}catch(e){toast(e.message);button.disabled=false;}
});
document.addEventListener('change',event=>{if(event.target.id==='kit-saved'&&securityKit){securityKit.saved=event.target.checked;const button=document.querySelector('[data-product="kit-continue"]');if(button)button.disabled=!securityKit.saved;}});
document.addEventListener('submit',async event=>{
 if(event.target.id==='onboarding-form'){event.preventDefault();await advanceOnboarding(event.target);}
 else if(event.target.id==='recover-form'){event.preventDefault();const form=event.target,f=new FormData(form),button=form.querySelector('button');if(f.get('password')!==f.get('confirm')){document.getElementById('recover-error').textContent='The passwords don’t match yet.';return;}button.disabled=true;try{const username=String(f.get('username')).trim();const result=await api('/api/recover',{method:'POST',body:JSON.stringify({username,recoveryCode:f.get('recoveryCode'),password:f.get('password')})});me=null;csrf='';showRecoveryKit(result.recoveryCode,username,()=>loginScreen(true));}catch(e){document.getElementById('recover-error').textContent=e.message;button.disabled=false;}}
});

function renderSettings(){return renderSettingsBase().replace('<div class="settings-grid">','<div class="settings-grid">'+productSettingsCard());}
function loginScreen(initialized){
 if(!initialized){startOnboarding();return;}
 document.body.classList.remove('display-mode');document.documentElement.dataset.theme='premium';
 app.innerHTML=productFrame('<section class="panel login-card"><div class="login-mark">'+icon('house')+'</div><h1>Welcome home.</h1><p class="subtle">Your plans, your people, your little corner of calm.</p><form id="login-form">'+field('Username','username','','text','required autocomplete="username" maxlength="40"')+field('Password','password','','password','required autocomplete="current-password" maxlength="200"')+'<p id="login-error" class="setup-error" role="alert"></p><button class="btn primary">Sign in</button></form><button type="button" class="btn ghost recover-link" data-product="recover">Recover access</button><p class="helper">Use your personal account on phones and a Display account on your kitchen screen.</p></section>');
 document.getElementById('login-form').addEventListener('submit',async event=>{event.preventDefault();const btn=event.target.querySelector('button');btn.disabled=true;try{await api('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(event.target).entries()))});await boot();}catch(e){document.getElementById('login-error').textContent=e.message;btn.disabled=false;}});
}
async function boot(){try{error='';if(LOCAL){if(String(location.search||'').includes('welcome=preview')){await startOnboarding(true);return;}try{const saved=localStorage.getItem(STORAGE);if(saved)state=validateImport(JSON.parse(saved));connection='Saved in this browser';}catch(_){error='The saved preview could not be loaded. Import a backup or use another browser profile.';connection='Storage problem';}me={id:'local',name:'Local preview',role:'admin'};render();return;}const current=await api('/api/me');if(!current.authenticated){me=null;csrf='';if(!current.initialized)await startOnboarding();else loginScreen(true);return;}me=current.user;csrf=current.csrf;if(me.role==='admin'&&String(location.search||'').includes('welcome=preview')){await startOnboarding(true);return;}const fresh=await api('/api/state');state=fresh.state;revision=fresh.revision;selected=today();connection='Connected to home';render();subscribe();}catch(e){me=null;app.innerHTML='<div class="login-screen"><section class="panel login-card"><h1>Home is taking a moment.</h1><p class="helper">'+esc(e.message)+' Check that the local server is running, then reload this page.</p><button class="btn" onclick="location.reload()">Try again</button></section></div>';}}
window.addEventListener('hashchange',render);window.addEventListener('online',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync();});window.addEventListener('storage',event=>{if(LOCAL&&event.key===STORAGE&&event.newValue){try{state=validateImport(JSON.parse(event.newValue));render();}catch(_){toast('Another tab saved invalid data. Export your current data.');}}});setInterval(clock,1000);setInterval(()=>{if(me&&view==='today'&&!dialog.open&&!wizard&&!securityKit)render();},60000);setInterval(()=>{if(!LOCAL&&me&&!wizard&&!securityKit)sync();},15000);boot();
})();
</script>
</body></html>
