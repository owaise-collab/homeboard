name: family-command-center

services:
  family:
    build: .
    image: homeboard:${HOMEBOARD_VERSION:-0.2.0-rc.1}
    restart: unless-stopped
    init: true
    ports:
      - "${HOMEBOARD_BIND:-127.0.0.1}:${HOMEBOARD_PORT:-8080}:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DATA_DIR: /data
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost:8080,127.0.0.1:8080}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
    volumes:
      - family_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  family_data:
